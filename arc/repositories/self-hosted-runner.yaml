{
  "repository": "https://github.com/f5-sales-demo/self-hosted-runner",
  "scale_sets": [
    {
      "profile": "socketless",
      "namespace": "arc-runners-socketless",
      "release": "self-hosted-runner-socketless",
      "runner_scale_set_name": "self-hosted-runner-socketless",
      "values": "arc/socketless-values.yaml",
      "min_runners": 0,
      "max_runners": 20
    },
    {
      "profile": "container-build",
      "namespace": "arc-runners-container-build",
      "release": "self-hosted-runner-container-build",
      "runner_scale_set_name": "self-hosted-runner-container-build",
      "values": "arc/container-build-values.yaml",
      "min_runners": 0,
      "max_runners": 5
    }
  ]
}
