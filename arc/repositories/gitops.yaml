{
  "repository": "https://github.com/f5-sales-demo/gitops",
  "scale_sets": [
    {
      "profile": "socketless",
      "namespace": "arc-runners-gitops-socketless",
      "release": "gitops-socketless",
      "runner_scale_set_name": "managed-socketless",
      "values": "arc/socketless-values.yaml",
      "min_runners": 0,
      "max_runners": 3
    },
    {
      "profile": "container-build",
      "namespace": "arc-runners-gitops-container-build",
      "release": "gitops-container-build",
      "runner_scale_set_name": "managed-container-build",
      "values": "arc/gitops-container-build-values.yaml",
      "min_runners": 0,
      "max_runners": 1
    },
    {
      "profile": "terraform",
      "namespace": "arc-runners-gitops-terraform",
      "release": "gitops-terraform",
      "runner_scale_set_name": "gitops-terraform",
      "values": "arc/terraform-values.yaml",
      "min_runners": 0,
      "max_runners": 10
    }
  ]
}
