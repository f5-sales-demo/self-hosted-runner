{
  "repository": "https://github.com/f5-sales-demo/xcsh-action",
  "scale_sets": [
    {
      "profile": "socketless",
      "namespace": "arc-runners-xcsh-action-socketless",
      "release": "xcsh-action-socketless",
      "runner_scale_set_name": "managed-socketless",
      "values": "arc/socketless-values.yaml",
      "min_runners": 0,
      "max_runners": 4
    },
    {
      "profile": "container-build",
      "namespace": "arc-runners-xcsh-action-container-build",
      "release": "xcsh-action-container-build",
      "runner_scale_set_name": "managed-container-build",
      "values": "arc/container-build-values.yaml",
      "min_runners": 0,
      "max_runners": 1
    }
  ]
}
