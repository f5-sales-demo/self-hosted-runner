{
  "repository": "https://github.com/f5-sales-demo/xcsh",
  "scale_sets": [
    {
      "profile": "socketless",
      "namespace": "arc-runners-xcsh-socketless",
      "release": "xcsh-socketless",
      "runner_scale_set_name": "xcsh-socketless",
      "values": "arc/socketless-values.yaml",
      "min_runners": 0,
      "max_runners": 10
    },
    {
      "profile": "container-build",
      "namespace": "arc-runners-xcsh-container-build",
      "release": "xcsh-container-build",
      "runner_scale_set_name": "xcsh-container-build",
      "values": "arc/container-build-values.yaml",
      "min_runners": 0,
      "max_runners": 3
    },
    {
      "profile": "compute",
      "namespace": "arc-runners-xcsh-compute",
      "release": "xcsh-compute",
      "runner_scale_set_name": "xcsh-compute",
      "values": "arc/compute-values.yaml",
      "min_runners": 0,
      "max_runners": 2
    }
  ]
}
