apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: runner-image-prepull-{{ .Values.profile }}
  labels:
    app.kubernetes.io/name: runner-image-prepull
    runner-profile: {{ .Values.profile }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: runner-image-prepull
      runner-profile: {{ .Values.profile }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runner-image-prepull
        runner-profile: {{ .Values.profile }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        runner-profile: {{ .Values.profile }}
      tolerations:
        - key: runner-profile
          operator: Equal
          value: {{ .Values.profile }}
          effect: NoSchedule
      {{- if .Values.additionalImages }}
      initContainers:
        {{- range $index, $image := .Values.additionalImages }}
        - name: pull-additional-{{ $index }}
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -c, "true"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
        {{- end }}
      {{- end }}
      containers:
        - name: hold-runner-image
          image: {{ required "image must be an immutable GHCR digest" .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, -c, "trap 'exit 0' TERM INT; while true; do sleep 3600; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 1001
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
