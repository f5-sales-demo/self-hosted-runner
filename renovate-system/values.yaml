image: ""
suspend: false
schedule: "20 5 * * *"
timeZone: America/Toronto
activeDeadlineSeconds: 2700
tokenSafetyMarginSeconds: 120
githubApp:
  appId: ""
  installationId: ""
  botId: ""
  botLogin: ""
  secretName: renovate-github-app
nodeSelector:
  runner-profile: socketless
resources:
  init:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
  renovate:
    requests: {cpu: 250m, memory: 6Gi}
    limits: {cpu: "2", memory: 12Gi}
ephemeralStorage:
  containerbaseSizeLimit: 2Gi
