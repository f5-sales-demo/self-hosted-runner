apiVersion: v1
kind: ServiceAccount
metadata:
  name: renovate
  labels: {app.kubernetes.io/name: renovate}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  labels: {app.kubernetes.io/name: renovate}
spec:
  schedule: {{ .Values.schedule | quote }}
  timeZone: {{ .Values.timeZone | quote }}
  suspend: {{ .Values.suspend }}
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {app.kubernetes.io/name: renovate}
        spec:
          serviceAccountName: renovate
          automountServiceAccountToken: false
          restartPolicy: Never
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 12021
            runAsGroup: 0
            fsGroup: 0
            seccompProfile: {type: RuntimeDefault}
          nodeSelector:
{{ toYaml .Values.nodeSelector | indent 12 }}
          tolerations:
            - {key: runner-profile, operator: Equal, value: socketless, effect: NoSchedule}
          initContainers:
            - name: verify-app-and-issue-token
              image: {{ .Values.image | quote }}
              imagePullPolicy: IfNotPresent
              command: [node, /opt/f5-renovate/app-token-init.mjs]
              env:
                - {name: RENOVATE_GITHUB_APP_ID, valueFrom: {configMapKeyRef: {name: {{ include "renovate.appName" . }}, key: app-id}}}
                - {name: RENOVATE_GITHUB_INSTALLATION_ID, valueFrom: {configMapKeyRef: {name: {{ include "renovate.appName" . }}, key: installation-id}}}
                - {name: RENOVATE_GITHUB_APP_BOT_ID, valueFrom: {configMapKeyRef: {name: {{ include "renovate.appName" . }}, key: bot-id}}}
                - {name: RENOVATE_GITHUB_APP_BOT_LOGIN, valueFrom: {configMapKeyRef: {name: {{ include "renovate.appName" . }}, key: bot-login}}}
                - {name: RENOVATE_JOB_DEADLINE_SECONDS, value: {{ .Values.activeDeadlineSeconds | quote }}}
                - {name: RENOVATE_TOKEN_SAFETY_MARGIN_SECONDS, value: {{ .Values.tokenSafetyMarginSeconds | quote }}}
                - {name: RENOVATE_GITHUB_APP_KEY_PATH, value: /github-app/private-key.pem}
                - {name: RENOVATE_TOKEN_FILE, value: /token/installation-token}
                - {name: RENOVATE_REPOSITORIES_FILE, value: /config/repositories.json}
              securityContext: &containerSecurity
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
                runAsNonRoot: true
                runAsUser: 12021
                runAsGroup: 0
              resources: {{ toYaml .Values.resources.init | nindent 16 }}
              volumeMounts:
                - {name: app-key, mountPath: /github-app, readOnly: true}
                - {name: config, mountPath: /config, readOnly: true}
                - {name: token, mountPath: /token}
                - {name: tmp, mountPath: /tmp}
          containers:
            - name: renovate
              image: {{ .Values.image | quote }}
              imagePullPolicy: IfNotPresent
              env:
                - {name: RENOVATE_TOKEN_FILE, value: /token/installation-token}
                - {name: RENOVATE_CONFIG_FILE, value: /config/renovate.json}
                - {name: RENOVATE_BASE_DIR, value: /work}
                - {name: RENOVATE_CACHE_DIR, value: /cache}
              securityContext: *containerSecurity
              resources: {{ toYaml .Values.resources.renovate | nindent 16 }}
              volumeMounts:
                - {name: config, mountPath: /config, readOnly: true}
                - {name: token, mountPath: /token}
                - {name: work, mountPath: /work}
                - {name: cache, mountPath: /cache}
                - {name: tmp, mountPath: /tmp}
                - {name: containerbase, mountPath: /opt/containerbase}
          volumes:
            - name: app-key
              secret:
                secretName: {{ .Values.githubApp.secretName }}
                defaultMode: 0440
                items: [{key: private-key.pem, path: private-key.pem}]
            - {name: config, configMap: {name: {{ include "renovate.configName" . }}}}
            - {name: token, emptyDir: {medium: Memory, sizeLimit: 1Mi}}
            - {name: work, emptyDir: {medium: Memory, sizeLimit: 2Gi}}
            - {name: cache, emptyDir: {medium: Memory, sizeLimit: 2Gi}}
            - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 4Gi}}
            - {name: containerbase, emptyDir: {medium: Memory, sizeLimit: 1Gi}}
