name: Verify current-source runner SBOM export

on:
  pull_request:
    paths:
      - .github/workflows/verify-sbom-export.yml
      - .github/workflows/publish.yml
      - Dockerfile
      - catalog/tool-catalog.json
      - scripts/download-verified-artifact.py
      - scripts/verify-sbom.py
      - tests/test_sbom_archive.py
      - tests/test_current_source_sbom_export.py

permissions:
  contents: read

concurrency:
  group: runner-sbom-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: standard
            target: standard
          - profile: container-build
            target: container-build
          - profile: super-linter-seed
            target: super-linter-seed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up bounded isolated BuildKit
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        with:
          driver: docker-container
          driver-opts: |
            memory=8g
            memory-swap=10g
            env.GOMEMLIMIT=6GiB
      - name: Authenticate for immutable package reads
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Prepare immutable current-source Super-Linter archive
        if: matrix.profile == 'super-linter-seed'
        run: scripts/build-super-linter-seed.sh
      - name: Export and verify current-source image SPDX evidence
        env:
          PROFILE: ${{ matrix.profile }}
          TARGET: ${{ matrix.target }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          scanner="$(jq -er '.base_images.sbom_scanner' catalog/tool-catalog.json)"
          [[ "$scanner" =~ ^docker\.io/docker/buildkit-syft-scanner@sha256:[0-9a-f]{64}$ ]]
          candidate_reference="ghcr.io/f5-sales-demo/self-hosted-runner:sbom-candidate-${SOURCE_SHA}-${PROFILE}"
          SBOM_EXPORT_DIR="${RUNNER_TEMP}/sbom-export-${PROFILE}"
          mkdir -p "$SBOM_EXPORT_DIR"
          printf 'profile=%s sourceCommit=%s scanner=%s candidateName=%s promotionEligible=false\n' \
            "$PROFILE" "$SOURCE_SHA" "$scanner" "$candidate_reference" >> "$SBOM_EXPORT_DIR/receipt.txt"
          docker buildx build --no-cache --platform linux/amd64 \
            --target "$TARGET" --tag "$candidate_reference" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --provenance=mode=max --sbom="generator=${scanner}" \
            --output "type=oci,dest=${SBOM_EXPORT_DIR}/candidate.oci.tar" \
            . 2>&1 | tee "$SBOM_EXPORT_DIR/export.log"
          python3 scripts/verify-sbom.py --oci-archive "$SBOM_EXPORT_DIR/candidate.oci.tar" \
            --expected-source-commit "$SOURCE_SHA" \
            --attribution-report "$SBOM_EXPORT_DIR/attribution.json" 2>&1 |
            tee -a "$SBOM_EXPORT_DIR/receipt.txt"
          sha256sum "$SBOM_EXPORT_DIR/candidate.oci.tar" >> "$SBOM_EXPORT_DIR/receipt.txt"
      - name: Retain export diagnostics and attribution receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runner-sbom-export-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sbom-export-${{ matrix.profile }}/export.log
            ${{ runner.temp }}/sbom-export-${{ matrix.profile }}/receipt.txt
            ${{ runner.temp }}/sbom-export-${{ matrix.profile }}/attribution.json
          if-no-files-found: error
          retention-days: 14
