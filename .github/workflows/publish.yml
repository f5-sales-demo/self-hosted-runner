name: Publish immutable runner images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-immutable-self-hosted-runner
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: standard
            target: standard
          - profile: container-build
            target: container-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          driver: docker-container
      - name: Authenticate to GHCR
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf "%s" "$TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Build, publish, and verify digest
        id: image
        env:
          IMAGE: ghcr.io/f5-sales-demo/self-hosted-runner
          PROFILE: ${{ matrix.profile }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          metadata="${RUNNER_TEMP}/metadata-${PROFILE}.json"
          tag="sha-${GITHUB_SHA}-${PROFILE}"
          docker buildx build \
            --no-cache \
            --platform linux/amd64 \
            --target "$TARGET" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=${SOURCE_DATE_EPOCH:-0}" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file "$metadata" \
            --push \
            --tag "${IMAGE}:${tag}" \
            .
          digest="$(jq -er ".\"containerimage.digest\"" "$metadata")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          reference="${IMAGE}@${digest}"
          docker buildx imagetools inspect "$reference" >/dev/null
          printf "digest=%s\nreference=%s\n" "$digest" "$reference" >> "$GITHUB_OUTPUT"
          printf "### %s\n\n\`%s\`\n" "$PROFILE" "$reference" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-name: ghcr.io/f5-sales-demo/self-hosted-runner
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
