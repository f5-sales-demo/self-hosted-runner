name: Validate AKS runner platform

on:
  pull_request:
    paths:
      - "arc/**"
      - "terraform/**"
      - "scripts/arc-*.sh"
      - "scripts/arc-*.py"
      - "scripts/check-committed-artifacts.sh"
      - "tests/test_aks_arc_contract.py"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "arc/**"
      - "terraform/**"
      - "scripts/arc-*.sh"
      - "scripts/arc-*.py"
      - "scripts/check-committed-artifacts.sh"
      - "tests/test_aks_arc_contract.py"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.14.4"
          terraform_wrapper: false
      - name: Install pinned Helm
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2             --output /tmp/helm.tgz             https://get.helm.sh/helm-v3.21.3-linux-amd64.tar.gz
          echo "15e041a93a590dce8100f39385cd98c84a765c9e36aeeb9e2dc6ff9e4769e2e0  /tmp/helm.tgz" |
            sha256sum --check --strict
          tar -xzf /tmp/helm.tgz -C /tmp
          sudo install -m 0555 /tmp/linux-amd64/helm /usr/local/bin/helm
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform
      - name: Validate Terraform without a backend
        run: |
          set -euo pipefail
          terraform -chdir=terraform/bootstrap init -backend=false
          terraform -chdir=terraform/bootstrap validate
          terraform -chdir=terraform/runner-fleet init -backend=false
          terraform -chdir=terraform/runner-fleet validate
      - name: Validate ARC Helm rendering
        run: scripts/validate-arc.sh
      - name: Refuse committed runtime and secret artifacts
        run: scripts/check-committed-artifacts.sh
