name: Audit governed self-hosted workflows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: docs-control policy and workflow ref
        required: true
        default: main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit all governed repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/audit-fleet-workflows.py --github --ref "${{ inputs.ref }}"
